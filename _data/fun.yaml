closing:
  - >
    Reading remains a cherished refuge of mine. I am drawn to fiction novels and philosophy, which together enrich
    my understanding of the world and the human experience. I cannot begin to describe how much reading has shaped
    who I am and how I view things since years ago.
    I am also on <a href="https://www.goodreads.com/user/show/122411744-tara-sabet" target="_blank">goodreads</a>!

  - >
    Feel free to take a look at my short article about learning and intellectual humility on <a href="https://medium.com/@extaraordinary/the-most-radical-thing-you-can-do-is-change-your-mind-9559c9bff252" target="_blank">Medium</a>.
    I've also written some thoughts on motion and progress <a href="https://extaraordinary.medium.com/the-treadmill-has-no-finish-line-164383b5c505" target="_blank">here</a>.
