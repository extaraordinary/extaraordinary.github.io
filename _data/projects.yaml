projects:
  - title: >
      High-Entropy Design of Transition Metal Oxide Semiconductors with Ultra-Low Thermal Conductivity
    tags: [Lattice Thermal Conductivity, Phonon Scattering, Thermoelectrics]
    description: >
      Led the first-principles thermal transport calculations explaining the ultra-low
      thermal conductivity (<1 W/m·K) of the high-entropy wolframite oxide
      (Mn,Fe,Co,Ni,Cu,Zn)WO<sub>4</sub>. Computed harmonic and anharmonic force constants
      via finite-displacement DFT (VASP, Phono3py) for the parent tungstate phases, solving
      the Boltzmann transport equation to extract phonon lifetimes and lattice thermal
      conductivity. Combined these results with a Debye–Klemens–Callaway model and
      experimental data to show that chemical disorder opens a crystal-momentum
      non-conserving three-phonon scattering channel — providing the first mechanistic
      explanation for the material's anomalous conductivity profile.
    paper: https://www.nature.com/articles/s43246-026-01103-2
    venue: Communications Materials, 2026

  - title: >
      Local Nuances in Vibrational Properties of High-Entropy Oxides Revealed by STEM-EELS
    tags: [DFPT, CHGNet, Phonon Unfolding, Machine Learning Interatomic Potentials]
    description: >
      Contributed the computational phonon modeling for a collaboration with Penn State,
      University of Michigan, and SuperSTEM (UK), correlating first-principles vibrational
      predictions with STEM-EELS measurements on high-entropy rock-salt oxides. Built an
      automated Quantum ESPRESSO DFPT workflow for the parent oxide phases, then developed a
      CHGNet machine-learned-potential pipeline via atomate2 to compute phonon densities of
      states on SQS supercells where direct DFPT was computationally prohibitive.
      Implemented a phonon band-unfolding code to project MLIP-derived force constants onto
      the primitive Brillouin zone, enabling direct comparison with experimental spectra.
    venue: In preparation

  - title: >
      Electrocaloric Performance of High-Entropy Perovskite Oxides from First Principles
    tags: [DFT, NEB, Phase Diagrams, Local Strain, Ferroelectrics, Electrocaloric COP]
    description: >
      Computed mixing enthalpies for 2,286 DFT-relaxed perovskite supercells (Ba/Ca/Sr-based)
      and constructed convex-hull phase diagrams to resolve formation energies. Applied
      Wang–Landau Monte Carlo sampling to map configurational entropy and identify
      thermodynamically stable compositions, then used NEB simulations and Boltzmann
      statistics to predict the temperature- and field-dependent polarization of the
      high-entropy perovskite oxide (Na,Bi,Sr,Ba,Ca)TiO<sub>3</sub>, estimating its
      electrocaloric performance.
    venue: Center for Nanoscale Science (MRSEC); APS March Meeting 2023/2024, MRS Spring Meeting 2024

  - title: >
      First-Principles Study of Aluminum Pnictide Semiconductors (AlAs, AlSb, AlBi)
    tags: [DFT, DFPT, Spin-Orbit Coupling, Semiconductors, Topological Insulators]
    description: >
      Performed DFT structural relaxation for zincblende aluminum pnictides, benchmarking
      lattice constants against experimental RHEED/XRD data from collaborators' MBE-grown
      films. Included spin-orbit coupling for AlBi via fully-relativistic pseudopotentials,
      fitting energy-volume curves to a Birch–Murnaghan equation of state, and computed
      phonon dispersion via DFPT to support experimental Raman spectroscopy interpretation
      of AlBi, a predicted topological insulator.
    venue: CMU–Penn State collaboration (NSF-supported)