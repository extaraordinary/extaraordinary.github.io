intro: >
  A small collection of select personal projects.

projects:
  - title: Data Visualization
    url: https://github.com/extaraordinary/data_visualization
    tags: [Python, Plotting]
    description: >
      A hands-on tutorial notebook covering visualization techniques using Python, from basic plots to interactive dashboards.
    thumb_aria_label: Bar and line chart illustration
    thumb_svg: |
      <defs>
        <linearGradient id="dvBarGrad" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="var(--deep-teal)"/>
          <stop offset="100%" stop-color="var(--teal)"/>
        </linearGradient>
        <pattern id="dvDots" width="18" height="18" patternUnits="userSpaceOnUse">
          <circle cx="1.2" cy="1.2" r="1.2" fill="var(--text)" opacity="0.10"/>
        </pattern>
      </defs>
      <rect width="400" height="240" fill="var(--card)"/>
      <rect width="400" height="240" fill="url(#dvDots)"/>
      <line x1="45" y1="196" x2="360" y2="196" stroke="var(--border)" stroke-width="1.5"/>
      <g>
        <rect x="65"  y="146" width="30" height="50"  rx="4" fill="url(#dvBarGrad)"/>
        <rect x="115" y="116" width="30" height="80"  rx="4" fill="url(#dvBarGrad)"/>
        <rect x="165" y="96"  width="30" height="100" rx="4" fill="url(#dvBarGrad)"/>
        <rect x="215" y="66"  width="30" height="130" rx="4" fill="url(#dvBarGrad)"/>
        <rect x="265" y="86"  width="30" height="110" rx="4" fill="url(#dvBarGrad)"/>
        <rect x="315" y="126" width="30" height="70"  rx="4" fill="url(#dvBarGrad)"/>
