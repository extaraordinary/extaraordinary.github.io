intro:
  - >
    Playing the piano has long been a central part of my life.
    I enjoy exploring a wide range of music that spans from the Romantic era—particularly the works of
    Chopin and Liszt—to contemporary composers such as Hans Zimmer, Max Richter, Ludovico Einaudi, and
    Yann Tiersen. Occasionally, I compose minimalist pieces of my own or reinterpret modern songs that
    resonate with me. You can listen to a performance of
    Claude Debussy's <a href="https://www.youtube.com/watch?v=aUbCEKy-R8c" target="_blank">Piano Trio in G Major</a>
    by our trio chamber ensemble, as well as our piano quintet's interpretation of
    Queen's <a href="https://www.youtube.com/watch?v=mPP6lBkw2GA" target="_blank">Bohemian Rhapsody</a>.

  - >
    Traveling and learning about new cultures constantly inspires me.
    I find delight in wandering around new places, discovering local art, savoring regional cuisine, and
    capturing the quiet rythms of daily life through photography.
    I also enjoy hiking, camping, and skiing; any excuse to be outdoors and feel connected to nature.

  - >
    I have recently discovered a deep appreciation for woodworking, and find it truly grounding and rewarding.
    Learning about CMU's TechSpark makerspace was a natural entry point, and I had the opportunity of benefiting
    from the tools and community to turn ideas into some cool, tangible objects. Some of my recent projects are:

